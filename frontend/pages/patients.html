<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Healthcare Management</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1>Healthcare Management</h1>
            <div class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="patients.html" class="active">Patients</a>
                <a href="appointments.html">Appointments</a>
                <a href="doctors.html">Doctors</a>
                <span id="userName"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="dashboard-container">
            <div class="action-bar">
                <h2>Patients Management</h2>
                <button class="btn btn-small" onclick="openAddModal()">Add Patient</button>
            </div>

            <div id="loadingPatients" class="loading">Loading patients...</div>
            <div id="patientsTable"></div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="patientModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Patient</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="patientForm" onsubmit="handleSubmit(event)">
                <input type="hidden" id="patientId">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="patientName" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="patientAge" required min="0">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="patientGender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="patientPhone">
                </div>
                <div class="form-group">
                    <label>Disease</label>
                    <input type="text" id="patientDisease" required>
                </div>
                <button type="submit" class="btn">Save Patient</button>
            </form>
            <div id="modalMessage" class="message"></div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        checkAuth();
        document.getElementById('userName').textContent = localStorage.getItem('userName');

        let editingPatientId = null;

        async function loadPatients() {
            try {
                const response = await fetch(`${API_URL}/patients`, {
                    headers: getAuthHeaders()
                });

                const data = await response.json();
                document.getElementById('loadingPatients').style.display = 'none';

                // Handle both array response and {patients: [...]} response
                const patientsList = Array.isArray(data) ? data : (data.patients || []);

                if (response.ok && patientsList.length > 0) {
                    displayPatients(patientsList);
                } else {
                    document.getElementById('patientsTable').innerHTML = '<div class="empty-state">No patients found. Add your first patient!</div>';
                }
            } catch (error) {
                document.getElementById('loadingPatients').style.display = 'none';
                document.getElementById('patientsTable').innerHTML = '<div class="message error">Error loading patients</div>';
            }
        }

        function displayPatients(patients) {
            const table = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Disease</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${patients.map(patient => `
                            <tr>
                                <td>${patient.id}</td>
                                <td>${patient.name}</td>
                                <td>${patient.age}</td>
                                <td>${patient.gender}</td>
                                <td>${patient.phone || 'N/A'}</td>
                                <td>${patient.disease}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-secondary btn-icon" onclick="editPatient(${patient.id})">Edit</button>
                                    <button class="btn btn-danger btn-icon" onclick="deletePatient(${patient.id})">Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('patientsTable').innerHTML = table;
        }

        function openAddModal() {
            editingPatientId = null;
            document.getElementById('modalTitle').textContent = 'Add Patient';
            document.getElementById('patientForm').reset();
            document.getElementById('patientId').value = '';
            document.getElementById('patientModal').classList.add('active');
        }

        async function editPatient(id) {
            try {
                const response = await fetch(`${API_URL}/patients/${id}`, {
                    headers: getAuthHeaders()
                });

                const data = await response.json();

                if (response.ok) {
                    editingPatientId = id;
                    document.getElementById('modalTitle').textContent = 'Edit Patient';
                    document.getElementById('patientId').value = id;
                    document.getElementById('patientName').value = data.patient.name;
                    document.getElementById('patientAge').value = data.patient.age;
                    document.getElementById('patientGender').value = data.patient.gender;
                    document.getElementById('patientPhone').value = data.patient.phone || '';
                    document.getElementById('patientDisease').value = data.patient.disease;
                    document.getElementById('patientModal').classList.add('active');
                }
            } catch (error) {
                alert('Error loading patient data');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const patientData = {
                name: document.getElementById('patientName').value,
                age: parseInt(document.getElementById('patientAge').value),
                gender: document.getElementById('patientGender').value,
                phone: document.getElementById('patientPhone').value,
                disease: document.getElementById('patientDisease').value
            };

            try {
                let response;
                if (editingPatientId) {
                    response = await fetch(`${API_URL}/patients/${editingPatientId}`, {
                        method: 'PUT',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(patientData)
                    });
                } else {
                    response = await fetch(`${API_URL}/patients`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(patientData)
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    closeModal();
                    loadPatients();
                } else {
                    document.getElementById('modalMessage').textContent = data.message || 'Operation failed';
                    document.getElementById('modalMessage').className = 'message error';
                }
            } catch (error) {
                document.getElementById('modalMessage').textContent = 'Error connecting to server';
                document.getElementById('modalMessage').className = 'message error';
            }
        }

        async function deletePatient(id) {
            if (!confirm('Are you sure you want to delete this patient?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/patients/${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    loadPatients();
                } else {
                    alert('Failed to delete patient');
                }
            } catch (error) {
                alert('Error connecting to server');
            }
        }

        function closeModal() {
            document.getElementById('patientModal').classList.remove('active');
            document.getElementById('patientForm').reset();
            document.getElementById('modalMessage').textContent = '';
        }

        // Load patients on page load
        loadPatients();
    </script>
</body>
</html>
